<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sancord — conceitos de ícone</title>
<style>
  body { margin: 0; font: 11px/1.3 system-ui, sans-serif; background: #0e0f13; color: #e6e6ea; }
  .concept { padding: 6px 8px; border-bottom: 1px solid #2a2a33; }
  .concept b { display: block; margin-bottom: 4px; font-size: 12px; }
  .strip { display: flex; align-items: flex-end; gap: 6px; padding: 4px; border-radius: 4px; }
  .strip.light { background: #f3f3f6; }
  .strip.task { background: #202020; }
  canvas { display: block; }
  .zoom { image-rendering: pixelated; }
  .pair { display: flex; gap: 6px; }
</style>
</head>
<body>
<div id="out"></div>
<script src="concepts.js"></script>
<script>
// Para cada conceito: tamanhos reais (16/24/32/48) ampliados 3x em pixels nítidos,
// em fundo escuro/claro/barra de tarefas, e uma prévia grande de 96px.
async function raster(svg, size) {
  const img = new Image();
  img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  await img.decode();
  const c = document.createElement('canvas');
  c.width = c.height = size;
  c.getContext('2d').drawImage(img, 0, 0, size, size);
  return c;
}
function zoomed(src, factor) {
  const c = document.createElement('canvas');
  c.width = c.height = src.width * factor;
  c.className = 'zoom';
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(src, 0, 0, c.width, c.height);
  return c;
}
(async () => {
  const out = document.getElementById('out');
  for (const [name, svg] of Object.entries(window.CONCEPTS)) {
    const box = document.createElement('div');
    box.className = 'concept';
    box.innerHTML = `<b>${name}</b>`;
    const pair = document.createElement('div');
    pair.className = 'pair';
    const big = await raster(svg, Number(new URLSearchParams(location.search).get('big') || 72));
    for (const cls of ['', 'light', 'task']) {
      const strip = document.createElement('div');
      strip.className = `strip ${cls}`;
      for (const s of [16, 24, 32]) strip.appendChild(zoomed(await raster(svg, s), 2));
      pair.appendChild(strip);
    }
    const bigStrip = document.createElement('div');
    bigStrip.className = 'strip';
    bigStrip.appendChild(big);
    pair.appendChild(bigStrip);
    box.appendChild(pair);
    out.appendChild(box);
  }
})();
</script>
</body>
</html>
