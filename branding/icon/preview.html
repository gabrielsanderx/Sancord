<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sancord — ícone final</title>
<style>
  body { margin: 0; font: 11px/1.3 system-ui, sans-serif; background: #0e0f13; color: #e6e6ea; }
  .row { display: flex; align-items: flex-end; gap: 8px; padding: 6px 8px; flex-wrap: wrap; }
  .light { background: #f3f3f6; color: #222; }
  .task { background: #202020; }
  .zoom { image-rendering: pixelated; }
  canvas, img { display: block; }
  small { display: block; text-align: center; opacity: .7; }
</style>
</head>
<body>
<div id="out"></div>
<script>
const load = async src => { const i = new Image(); i.src = src + '?v=' + Date.now(); await i.decode(); return i; };
function raster(img, size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(img, 0, 0, size, size); return c;
}
function zoomed(src, f) {
  const c = document.createElement('canvas'); c.width = c.height = src.width * f; c.className = 'zoom';
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(src, 0, 0, c.width, c.height); return c;
}
function cell(node, label) { const d = document.createElement('div'); d.append(node); const s = document.createElement('small'); s.textContent = label; d.append(s); return d; }
(async () => {
  const master = await load('sancord-icon.svg'), small = await load('sancord-icon-small.svg');
  const out = document.getElementById('out');
  for (const cls of ['', 'light', 'task']) {
    const row = document.createElement('div'); row.className = 'row ' + cls;
    for (const s of [16, 24, 32]) row.append(cell(zoomed(raster(small, s), 3), `${s} small`));
    for (const s of [16, 24, 32]) row.append(cell(zoomed(raster(master, s), 3), `${s} master`));
    out.append(row);
  }
  const big = document.createElement('div'); big.className = 'row';
  for (const s of [48, 64, 128]) big.append(cell(raster(master, s), String(s)));
  out.append(big);
})();
</script>
</body>
</html>
