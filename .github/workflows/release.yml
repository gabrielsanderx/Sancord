name: Stable Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  package:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SANVO_DISCOVERY_PUBKEY: ${{ vars.SANVO_DISCOVERY_PUBKEY || vars.SANCORD_DISCOVERY_PUBKEY }}
      SANCORD_DISCOVERY_PUBKEY: ${{ vars.SANVO_DISCOVERY_PUBKEY || vars.SANCORD_DISCOVERY_PUBKEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Confirmar release estável na branch main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'A tag precisa apontar para um commit da main.' }
          cargo run --locked --bin sancord-release -- validate $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Configuração de release inválida.' }
      - name: Preparar dependências
        run: ./scripts/prepare-windows.ps1
      - name: Gerar cliente, backend e pacote portátil
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-release
          path: dist/
          if-no-files-found: error
          retention-days: 7
  sign:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-windows-release
          path: dist
      - name: Assinar e verificar metadados
        env:
          SANVO_UPDATE_SIGNING_KEY: ${{ secrets.SANVO_UPDATE_SIGNING_KEY || secrets.SANCORD_UPDATE_SIGNING_KEY }}
          SANCORD_UPDATE_SIGNING_KEY: ${{ secrets.SANCORD_UPDATE_SIGNING_KEY || secrets.SANVO_UPDATE_SIGNING_KEY }}
        run: |
          ./dist/release-tools.exe sign dist dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Assinatura recusada.' }
          ./dist/release-tools.exe verify dist
          if ($LASTEXITCODE -ne 0) { throw 'Verificação recusada.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-windows-release
          path: |
            dist/Sanvo.exe
            dist/SanvoServer.exe
            dist/Sanvo-*-windows-x64.zip
            dist/sanvo-update.json
            dist/sanvo-update.sig
            dist/Sancord.exe
            dist/SancordServer.exe
            dist/Sancord-*-windows-x64.zip
            dist/sancord-update.json
            dist/sancord-update.sig
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7
  verify-package:
    needs: sign
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-windows-release
          path: qa-signed-artifact
      - name: Rust estável (Windows x64 MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Preparar dependências verificadas
        run: ./scripts/prepare-windows.ps1
      - name: Validar transferência HTTPS do pacote real assinado
        env:
          SANCORD_QA_SIGNED_RELEASE_DIR: ${{ github.workspace }}/qa-signed-artifact
        run: |
          cargo test --locked --lib updates::https_tests::https_downloads_real_ci_artifact_with_embedded_release_key -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { throw 'Ensaio HTTPS do pacote assinado recusado.' }
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify-package
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-windows-release
          path: dist
      - name: Publicar somente depois do upload completo
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Essa release já existe. Não será sobrescrita.' }
          $sanvoZip = Get-ChildItem dist -Filter 'Sanvo-*-windows-x64.zip'
          $legacyZip = Get-ChildItem dist -Filter 'Sancord-*-windows-x64.zip'
          if (@($sanvoZip).Count -ne 1 -or @($legacyZip).Count -ne 1) { throw 'Pacote de release ambíguo.' }
          gh release create $env:RELEASE_TAG dist/Sanvo.exe dist/SanvoServer.exe $sanvoZip.FullName dist/sanvo-update.json dist/sanvo-update.sig dist/Sancord.exe dist/SancordServer.exe $legacyZip.FullName dist/sancord-update.json dist/sancord-update.sig --draft --verify-tag --title "Sanvo $env:RELEASE_TAG" --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Upload incompleto; não publicar o draft.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'A release permaneceu em draft; revise no GitHub.' }
