[lib]
name = "sancord"
path = "src/lib.rs"

[[bin]]
name = "sancord"
path = "src/main.rs"

[[bin]]
name = "SancordApp"
path = "src/bin/SancordApp.rs"

[[bin]]
name = "SancordBundle"
path = "src/bin/SancordBundle.rs"
required-features = ["bundle"]

[[bin]]
name = "sancord-release"
path = "src/bin/release_tools.rs"

[features]
bundle = []

[build-dependencies]
embed-resource = "2.5"

[dependencies]
# PersistÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Âªncia: SQLite embutido (compila o SQLite junto, sem depender do sistema)
rusqlite = { version = "0.32", features = ["bundled"] }
# Hash de senha moderno (Argon2id) + geraÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â§ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â£o de tokens com OsRng
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Envio dos codigos de confirmacao de e-mail por SMTP (TLS nativo do Windows).
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "native-tls"] }
