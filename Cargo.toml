[package]
name = "sancord"
version = "0.2.7"
edition = "2021"
# BinÃƒÂ¡rios declarados explicitamente: `src/bin/capture_bridge.rs` ÃƒÂ© um mÃƒÂ³dulo do
# SancordApp, nÃƒÂ£o um programa (a detecÃƒÂ§ÃƒÂ£o automÃƒÂ¡tica o tratava como binÃƒÂ¡rio sem `main`).
autobins = false
description = "Sancord Ã¢â‚¬â€ plataforma de comunicaÃƒÂ§ÃƒÂ£o em tempo real (Axum + WebSockets + SQLite + WebRTC)"

[lib]
name = "sancord"
path = "src/lib.rs"

[[bin]]
name = "sancord"
path = "src/main.rs"

[[bin]]
name = "SancordApp"
path = "src/bin/SancordApp.rs"

[[bin]]
name = "SancordBundle"
path = "src/bin/SancordBundle.rs"
required-features = ["bundle"]

[[bin]]
name = "sancord-release"
path = "src/bin/release_tools.rs"

[features]
bundle = []

[build-dependencies]
embed-resource = "2.5"

[dependencies]
# PersistÃƒÂªncia: SQLite embutido (compila o SQLite junto, sem depender do sistema)
rusqlite = { version = "0.32", features = ["bundled"] }
# Hash de senha moderno (Argon2id) + geraÃƒÂ§ÃƒÂ£o de tokens com OsRng
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tracing-appender = "0.2"
# Assinatura dos anÃƒÂºncios de descoberta (host assina, app desktop verifica)
ed25519-dalek = "2"
# ServiceExt para servir anexos com ServeFile (suporte a Range/ETag)
tower = { version = "0.4", features = ["util"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tao = "0.30"
wry = "0.47"
# Mesma versÃ£o que o wry usa: permissÃµes de microfone/cÃ¢mera do WebView2.
webview2-com = "0.33"
tokio-tungstenite = "0.24"
windows-core = "0.58"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
] }

[dev-dependencies]
# Certificados efÃƒÂªmeros e servidor HTTPS somente para os testes do updater.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
