# ServiceExt para servir anexos com ServeFile (suporte a Range/ETag)
tower = { version = "0.4", features = ["util"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tao = "0.30"
wry = "0.47"
# Mesma versÃƒÆ’Ã‚Â£o que o wry usa: permissÃƒÆ’Ã‚Âµes de microfone/cÃƒÆ’Ã‚Â¢mera do WebView2.
webview2-com = "0.33"
tokio-tungstenite = "0.24"
windows-core = "0.58"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
] }

[dev-dependencies]
# Certificados efÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Âªmeros e servidor HTTPS somente para os testes do updater.
